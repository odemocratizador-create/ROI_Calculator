<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Calculadora de ROI — Cibersegurança</title>
<style>
:root{--bg:#f0f4f8;--surface:#fff;--surface2:#e8edf2;--border:#c8d0db;--accent:#2563eb;--accent2:#7c3aed;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--text:#1e293b;--muted:#64748b;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}
.app{max-width:1400px;margin:0 auto;padding:0 20px 60px}
.app-header{padding:24px 0 18px;border-bottom:2px solid var(--border);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.app-header h1{font-size:22px;font-weight:800;color:var(--accent)}
.app-header p{color:var(--muted);font-size:12px;margin-top:2px}
.header-btns{display:flex;gap:8px}
.app-main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;font-size:13px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.12)}
.mths{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.mbtn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
.mbtn:hover{border-color:var(--accent);color:var(--accent)}
.mbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.mcustom{width:60px!important}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 7px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 5px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(37,99,235,.03)}
.isz{width:85px!important}
.ixs{width:55px!important}
.ilg{width:150px!important}
.mkc{display:flex;align-items:center;gap:5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:85px;height:4px;background:var(--border);border-radius:4px;border:none;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.qc{display:flex;flex-direction:column;gap:2px}
.vh{font-size:10px;color:var(--warn)}
.btn{border:none;border-radius:6px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--accent);color:#fff}.bp:hover{background:#1d4ed8}
.bs{background:var(--surface2);border:1px solid var(--border);color:var(--text)}.bs:hover{border-color:var(--accent);color:var(--accent)}
.bsu{background:#15803d;color:#fff}
.bi{background:transparent;border:1px solid transparent;border-radius:5px;cursor:pointer;padding:3px 6px;font-size:13px}
.bi.d{color:var(--bad)}.bi.d:hover{background:rgba(220,38,38,.1);border-color:var(--bad)}
.badd{margin-top:8px;background:transparent;border:1px dashed var(--border);color:var(--accent);border-radius:6px;padding:7px;cursor:pointer;font-size:13px;width:100%}
.badd:hover{background:rgba(37,99,235,.06);border-color:var(--accent)}
.taxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.taxf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.taxin{display:flex;align-items:center;gap:5px}
.unit{font-size:12px;color:var(--muted)}
.rp{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border-color:var(--accent)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.kg{border-color:var(--good)}.kg .kv{color:var(--good)}
.kw{border-color:var(--warn)}.kw .kv{color:var(--warn)}
.kb{border-color:var(--bad)}.kb .kv{color:var(--bad)}
details summary{cursor:pointer;color:var(--muted);font-size:12px;padding:4px 0;user-select:none}
.bkt{margin-top:8px;border-collapse:collapse;font-size:13px;width:340px}
.bkt td{padding:5px 9px;border-bottom:1px solid var(--border)}
.bkt td:first-child{color:var(--muted)}
.bkt .tr td{font-weight:700;border-top:1px solid var(--border);border-bottom:none}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.md.sm{max-width:620px}
.mdh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mdh h2{font-size:15px;font-weight:700}
.mdx{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.mdx:hover{color:var(--text)}
.mdtabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;overflow-x:auto}
.mdt{padding:9px 14px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.mdt.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.mdt:hover{color:var(--text)}
.mdb{padding:18px 20px;overflow-y:auto;flex:1}
.mdf{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.stbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.stbl th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;padding:5px 7px;border-bottom:1px solid var(--border)}
.stbl td{padding:6px 5px;border-bottom:1px solid var(--border);vertical-align:middle}
.stbl tr:last-child td{border-bottom:none}
.stbl input,.stbl select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 7px;font-size:12px;outline:none;width:auto}
.slbl{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 7px}
.ar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px;background:var(--surface2);border-radius:6px;margin-top:7px;border:1px solid var(--border)}
.ar input,.ar select{flex:1;min-width:80px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 7px;font-size:12px;outline:none}
.excnt{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;max-height:400px;overflow-y:auto}
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div>
      <h1>Calculadora de ROI</h1>
      <p>Precificação para Faturamento — Cibersegurança</p>
    </div>
    <div class="header-btns">
      <button class="btn bs" onclick="openSettings()">⚙ Configurações</button>
      <button class="btn bp" onclick="openExport()">📄 Exportar</button>
    </div>
  </div>
  <div class="app-main" id="main"></div>
</div>
<div id="modals"></div>

<script>
// ── Utilitários ────────────────────────────────────────────────────
const fmt    = v => isNaN(v)?'R$ 0,00':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtPct = v => (v*100).toFixed(3).replace(/\.?0+$/,'')+'%';
let _id=200; const uid=()=>String(++_id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const VOL=[{max:99,d:.2},{max:999,d:.1},{max:Infinity,d:.05}];
const COPT=[12,24,36,48,60];
const SVC_TYPES=['Serviço','Consultoria','Implantação','Treinamento'];

// ── Estado global ─────────────────────────────────────────────────
const S = {
  catalog:      ld('roi_cat',[{id:'m1',name:'IBM',products:[{id:'p1',name:'MaaS360',modules:[{id:'md1',name:'Essentials',cost:17.87,mk:1.7},{id:'md2',name:'TeamViewer',cost:2.96,mk:1.4}]}]}]),
  distributors: ld('roi_dist',[{id:'d1',name:'Ingram',iss:.0565},{id:'d2',name:'CLM',iss:.0565}]),
  svcPresets:   ld('roi_svc',[{id:'s1',type:'Serviço',desc:'Atividades horario comercial',rate:75,mk:2},{id:'s2',type:'Serviço',desc:'Atividades fora do horario comercial',rate:150,mk:1}]),
  project:      {client:'',manager:'',flow:'',months:12},
  taxes:        {iss:.0565,adm:.05,com:.045,sup:0,add:0},
  distId:       '',
  licenses:     [],
  services:     [],
  modal:        null,
  stab:         'dist',
  sprodId:      '',
  smfrId:       '',
};

function persist(){sv('roi_cat',S.catalog);sv('roi_dist',S.distributors);sv('roi_svc',S.svcPresets)}

// ── Init ──────────────────────────────────────────────────────────
function newLic(){
  const m=S.catalog[0],p=m?.products[0],md=p?.modules[0];
  return {id:uid(),mfrId:m?.id||'',mfrNm:m?.name||'',prodId:p?.id||'',prodNm:p?.name||'',modId:md?.id||'',modNm:md?.name||'',qty:190,cost:md?.cost||0,mk:md?.mk||1.5};
}
function newSvc(){
  const s=S.svcPresets[0];
  return {id:uid(),preId:s?.id||'',type:s?.type||'Serviço',desc:s?.desc||'',hrs:0,rate:s?.rate||75,mk:s?.mk||2};
}
if(!S.licenses.length) S.licenses.push(newLic());
if(!S.services.length) S.services.push(newSvc());
S.distId=S.distributors[0]?.id||'';

// ── Cálculo ───────────────────────────────────────────────────────
function calcRow(qty,cost,mk,tr){
  const su=cost*mk,tot=qty*su,tax=tot*tr,c=qty*cost;
  return {su,tot,tax,c,profit:tot-c-tax};
}
function calcAll(){
  const tr=S.taxes.iss+S.taxes.adm+S.taxes.com+S.taxes.sup;
  const lr=S.licenses.map(l=>calcRow(l.qty,l.cost,l.mk,tr));
  const sr=S.services.map(s=>calcRow(s.hrs,s.rate,s.mk,tr));
  const mRev=[...lr,...sr].reduce((a,r)=>a+r.tot,0);
  const tRev=mRev*S.project.months;
  const raw=[...lr,...sr].reduce((a,r)=>a+r.c,0)*S.project.months;
  const iss=tRev*S.taxes.iss,adm=tRev*S.taxes.adm,com=tRev*S.taxes.com,sup=tRev*S.taxes.sup;
  const tCost=iss+adm+com+sup+S.taxes.add+raw;
  const net=tRev-tCost;
  return {mRev,tRev,tCost,raw,iss,adm,com,sup,net,rent:tRev>0?net/tRev:0,lr,sr};
}

// ── Render ────────────────────────────────────────────────────────
function render(){
  const R=calcAll();
  document.getElementById('main').innerHTML=
    renderProject()+renderLicenses(R)+renderServices(R)+renderTax()+renderResult(R);
  document.getElementById('modals').innerHTML=
    S.modal==='settings'?renderSettings():
    S.modal==='export'?renderExport(R):'';
}

// ── Projeto ───────────────────────────────────────────────────────
function renderProject(){
  return `<div class="card">
    <div class="card-title">Dados do Projeto</div>
    <div class="grid2">
      <div class="fld">Cliente<input value="${esc(S.project.client)}" onchange="S.project.client=this.value;render()"/></div>
      <div class="fld">Gerente de Contas<input value="${esc(S.project.manager)}" onchange="S.project.manager=this.value;render()"/></div>
      <div class="fld">Nº do Fluxo<input value="${esc(S.project.flow)}" onchange="S.project.flow=this.value;render()"/></div>
      <div class="fld">Tempo de Contrato
        <div class="mths">
          ${COPT.map(m=>`<button class="mbtn${S.project.months===m?' on':''}" onclick="S.project.months=${m};render()">${m}m</button>`).join('')}
          <input type="number" min="1" value="${S.project.months}" class="mcustom" onchange="S.project.months=Number(this.value);render()"/>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Licenças ──────────────────────────────────────────────────────
function volHint(q){const t=VOL.find(t=>q<=t.max);return t?`Ref: ${(t.d*100).toFixed(0)}% desc.`:'';}
function renderLicenses(R){
  const rows=S.licenses.map((l,i)=>{
    const r=R.lr[i]||{};
    const cat=S.catalog.find(c=>c.id===l.mfrId);
    const prod=cat?.products.find(p=>p.id===l.prodId);
    const pCls=(r.profit||0)<0?'neg':'pos';
    return `<tr>
      <td><select onchange="licMfr('${l.id}',this.value)">
        ${S.catalog.map(c=>`<option value="${c.id}"${c.id===l.mfrId?' selected':''}>${esc(c.name)}</option>`).join('')}
        <option value="__x"${l.mfrId==='__x'?' selected':''}>Outro...</option>
      </select></td>
      <td>${cat?`<select onchange="licProd('${l.id}',this.value)">
        ${cat.products.map(p=>`<option value="${p.id}"${p.id===l.prodId?' selected':''}>${esc(p.name)}</option>`).join('')}
      </select>`:`<input value="${esc(l.prodNm)}" onchange="licPatch('${l.id}','prodNm',this.value)" class="isz"/>`}</td>
      <td>${prod?`<select onchange="licMod('${l.id}',this.value)">
        ${prod.modules.map(m=>`<option value="${m.id}"${m.id===l.modId?' selected':''}>${esc(m.name)}</option>`).join('')}
      </select>`:`<input value="${esc(l.modNm)}" onchange="licPatch('${l.id}','modNm',this.value)" class="isz"/>`}</td>
      <td><div class="qc">
        <input type="number" min="0" value="${l.qty}" class="isz" onchange="licPatch('${l.id}','qty',Number(this.value))"/>
        <span class="vh">${volHint(l.qty)}</span>
      </div></td>
      <td><input type="number" min="0" step="0.01" value="${l.cost}" class="isz" onchange="licPatch('${l.id}','cost',Number(this.value))"/></td>
      <td><div class="mkc">
        <input type="range" min="1" max="5" step="0.05" value="${l.mk}" oninput="licPatch('${l.id}','mk',Number(this.value))"/>
        <input type="number" min="1" step="0.05" value="${l.mk}" class="ixs" onchange="licPatch('${l.id}','mk',Number(this.value))"/>
      </div></td>
      <td class="num">${fmt(r.su||0)}</td>
      <td class="num">${fmt(r.tot||0)}</td>
      <td class="num ${pCls}">${fmt(r.profit||0)}</td>
      <td><button class="bi d" onclick="rmLic('${l.id}')">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="card-title">Licenças</div>
    <div class="tw"><table>
      <thead><tr><th>Fabricante</th><th>Produto</th><th>Módulo</th><th>Qtd</th><th>Custo Unit.(R$)</th><th>Markup</th><th>Preço Venda</th><th>Total Mensal</th><th>Lucro Líq.(mês)</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <button class="badd" onclick="addLic()">+ Adicionar Licença</button>
  </div>`;
}

// ── Serviços ──────────────────────────────────────────────────────
function renderServices(R){
  const rows=S.services.map((s,i)=>{
    const r=R.sr[i]||{};
    const pCls=(r.profit||0)<0?'neg':'pos';
    return `<tr>
      <td><select onchange="svcSel('${s.id}',this.value)">
        <option value="">— selecione —</option>
        ${S.svcPresets.map(p=>`<option value="${p.id}"${p.id===s.preId?' selected':''}>${esc(p.type)} — ${esc(p.desc)}</option>`).join('')}
        <option value="__x"${s.preId==='__x'?' selected':''}>Personalizado</option>
      </select></td>
      <td><input value="${esc(s.desc)}" class="ilg" onchange="svcPatch('${s.id}','desc',this.value)"/></td>
      <td><input type="number" min="0" value="${s.hrs}" class="isz" onchange="svcPatch('${s.id}','hrs',Number(this.value))"/></td>
      <td><input type="number" min="0" step="0.01" value="${s.rate}" class="isz" onchange="svcPatch('${s.id}','rate',Number(this.value))"/></td>
      <td><div class="mkc">
        <input type="range" min="1" max="5" step="0.1" value="${s.mk}" oninput="svcPatch('${s.id}','mk',Number(this.value))"/>
        <input type="number" min="1" step="0.1" value="${s.mk}" class="ixs" onchange="svcPatch('${s.id}','mk',Number(this.value))"/>
      </div></td>
      <td class="num">${fmt(r.su||0)}</td>
      <td class="num">${fmt(r.tot||0)}</td>
      <td class="num ${pCls}">${fmt(r.profit||0)}</td>
      <td><button class="bi d" onclick="rmSvc('${s.id}')">✕</button></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="card-title">Serviços de Suporte</div>
    <div class="tw"><table>
      <thead><tr><th>Preset</th><th>Descrição</th><th>Horas</th><th>Valor Hora(R$)</th><th>Markup</th><th>Preço Hora</th><th>Total</th><th>Lucro Líq.</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <button class="badd" onclick="addSvc()">+ Adicionar Serviço</button>
  </div>`;
}

// ── Parâmetros fiscais ────────────────────────────────────────────
function renderTax(){
  const d=S.distributors.find(d=>d.id===S.distId);
  const fields=[
    {k:'iss',lbl:'ISS (crédito PIS/Cofins)'},
    {k:'adm',lbl:'ADM'},
    {k:'com',lbl:'Comercial'},
    {k:'sup',lbl:'Suporte interno'},
    {k:'add',lbl:'Serviços adicionais (R$)',fix:true},
  ];
  return `<div class="card">
    <div class="card-title">Parâmetros Fiscais e Administrativos</div>
    <div style="margin-bottom:12px">
      <div class="fld" style="max-width:300px">Distribuidor
        <select onchange="selDist(this.value)">
          <option value="">— não selecionado —</option>
          ${S.distributors.map(d=>`<option value="${d.id}"${d.id===S.distId?' selected':''}>${esc(d.name)} (ISS ${fmtPct(d.iss)})</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="taxg">
      ${fields.map(f=>`<div class="taxf"><span>${f.lbl}</span>
        <div class="taxin">
          <input type="number" min="0" step="${f.fix?'1':'0.001'}" class="isz"
            value="${f.fix?S.taxes[f.k]:+(S.taxes[f.k]*100).toFixed(4)}"
            onchange="setTax('${f.k}',${f.fix?'Number(this.value)':'Number(this.value)/100'})"/>
          ${f.fix?'':'<span class="unit">%</span>'}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ── Resultado ─────────────────────────────────────────────────────
function renderResult(R){
  const rc=R.rent>=.15?'kg':R.rent>=.05?'kw':'kb';
  const lc=R.net>=0?'kg':'kb';
  return `<div class="card rp">
    <div class="card-title">Resultado — ${S.project.months} meses</div>
    <div class="kgrid">
      <div class="kpi"><span class="kl">Fat. Mensal</span><span class="kv">${fmt(R.mRev)}</span></div>
      <div class="kpi"><span class="kl">Fat. Total (${S.project.months}m)</span><span class="kv">${fmt(R.tRev)}</span></div>
      <div class="kpi"><span class="kl">Custo Total</span><span class="kv neg">${fmt(R.tCost)}</span></div>
      <div class="kpi ${lc}"><span class="kl">LL (Lucro Líquido)</span><span class="kv">${fmt(R.net)}</span></div>
      <div class="kpi ${rc}"><span class="kl">RENT (Rentabilidade)</span><span class="kv">${fmtPct(R.rent)}</span></div>
    </div>
    <details>
      <summary>▸ Detalhamento de custos</summary>
      <table class="bkt">
        <tr><td>Custo Produto/Serviço</td><td class="num">${fmt(R.raw)}</td></tr>
        <tr><td>ISS</td><td class="num">${fmt(R.iss)}</td></tr>
        <tr><td>ADM</td><td class="num">${fmt(R.adm)}</td></tr>
        <tr><td>Comercial</td><td class="num">${fmt(R.com)}</td></tr>
        <tr><td>Suporte interno</td><td class="num">${fmt(R.sup)}</td></tr>
        <tr class="tr"><td><strong>Total</strong></td><td class="num neg"><strong>${fmt(R.tCost)}</strong></td></tr>
      </table>
    </details>
  </div>`;
}

// ── Modal Configurações ───────────────────────────────────────────
function renderSettings(){
  const tabs=[['dist','Distribuidores'],['fab','Fabricantes'],['lic','Licenças'],['svc','Serviços']];
  return `<div class="ov" onclick="if(event.target===this)closeModal()">
    <div class="md">
      <div class="mdh"><h2>⚙ Configurações</h2><button class="mdx" onclick="closeModal()">✕</button></div>
      <div class="mdtabs">${tabs.map(([k,l])=>`<div class="mdt${S.stab===k?' on':''}" onclick="S.stab='${k}';render()">${l}</div>`).join('')}</div>
      <div class="mdb">${renderStabContent()}</div>
      <div class="mdf"><button class="btn bp" onclick="closeModal()">Fechar</button></div>
    </div>
  </div>`;
}
function renderStabContent(){
  if(S.stab==='dist') return renderDistTab();
  if(S.stab==='fab')  return renderFabTab();
  if(S.stab==='lic')  return renderLicTab();
  if(S.stab==='svc')  return renderSvcTab();
  return '';
}
function renderDistTab(){
  return `<div class="slbl">Distribuidores cadastrados</div>
  <table class="stbl">
    <thead><tr><th>Nome</th><th>ISS — crédito PIS/Cofins (%)</th><th></th></tr></thead>
    <tbody>
      ${S.distributors.map(d=>`<tr>
        <td><input value="${esc(d.name)}" style="width:150px" onchange="updDist('${d.id}','name',this.value)"/></td>
        <td><input type="number" value="${+(d.iss*100).toFixed(4)}" step="0.001" min="0" style="width:85px" onchange="updDist('${d.id}','iss',Number(this.value)/100)"/> %</td>
        <td><button class="bi d" onclick="delDist('${d.id}')">✕</button></td>

    </tbody>
  </table>
  <div class="ar">
    <input id="dn" placeholder="Nome do distribuidor"/>
    <input type="number" id="di" placeholder="ISS %" value="5.65" step="0.001" min="0" style="max-width:90px"/>
    <span class="unit">%</span>
    <button class="btn bp" onclick="addDist()">+ Adicionar</button>
  </div>`;
}
function renderFabTab(){
  return `<div class="slbl">Fabricantes</div>
  <table class="stbl">
    <thead><tr><th>Nome</th><th>Produtos</th><th></th></tr></thead>
    <tbody>
      ${S.catalog.map(m=>`<tr>
        <td><input value="${esc(m.name)}" style="width:160px" onchange="updMfr('${m.id}',this.value)"/></td>
        <td style="color:var(--muted);font-size:12px">${m.products.map(p=>esc(p.name)).join(', ')||'—'}</td>
        <td><button class="bi d" onclick="delMfr('${m.id}')">✕</button></td>
      </tr>`).join('')}
    </tbody>
  </table>
  <div class="ar">
    <input id="fn" placeholder="Nome do fabricante"/>
    <button class="btn bp" onclick="addMfr()">+ Adicionar</button>
  </div>`;
}
function renderLicTab(){
  const mfr=S.catalog.find(m=>m.id===S.smfrId)||S.catalog[0];
  if(mfr&&!S.smfrId) S.smfrId=mfr.id;
  const prod=mfr?.products.find(p=>p.id===S.sprodId);
  return `<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
    <div class="fld" style="flex:1;min-width:130px">Fabricante
      <select onchange="S.smfrId=this.value;S.sprodId='';render()">
        ${S.catalog.map(m=>`<option value="${m.id}"${m.id===S.smfrId?' selected':''}>${esc(m.name)}</option>`).join('')}
      </select>
    </div>
    <div class="fld" style="flex:1;min-width:130px">Produto
      <select onchange="S.sprodId=this.value;render()">
        <option value="">— selecione —</option>
        ${(mfr?.products||[]).map(p=>`<option value="${p.id}"${p.id===S.sprodId?' selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>
  </div>
  ${mfr?`<div class="slbl">Produtos de ${esc(mfr.name)}</div>
  <table class="stbl">
    <thead><tr><th>Produto</th><th></th></tr></thead>
    <tbody>
      ${mfr.products.map(p=>`<tr style="cursor:pointer;background:${p.id===S.sprodId?'rgba(37,99,235,.08)':''}">
        <td onclick="S.sprodId='${p.id}';render()"><input value="${esc(p.name)}" onclick="event.stopPropagation()" onchange="updProd('${mfr.id}','${p.id}',this.value)" style="width:180px"/></td>
        <td><button class="bi d" onclick="delProd('${mfr.id}','${p.id}')">✕</button></td>
      </tr>`).join('')}
    </tbody>
  </table>
  <div class="ar">
    <input id="pn" placeholder="Nome do produto"/>
    <button class="btn bp" onclick="addProd('${mfr.id}')">+ Produto</button>
  </div>`:''}
  ${prod?`<div class="slbl" style="margin-top:16px">Módulos de ${esc(prod.name)}</div>
  <table class="stbl">
    <thead><tr><th>Módulo</th><th>Custo Unit. (R$)</th><th>Markup padrão</th><th></th></tr></thead>
    <tbody>
      ${prod.modules.map(md=>`<tr>
        <td><input value="${esc(md.name)}" style="width:120px" onchange="updMod('${mfr.id}','${prod.id}','${md.id}','name',this.value)"/></td>
        <td><input type="number" value="${md.cost}" step="0.01" min="0" style="width:80px" onchange="updMod('${mfr.id}','${prod.id}','${md.id}','cost',Number(this.value))"/></td>
        <td><input type="number" value="${md.mk}" step="0.05" min="1" style="width:70px" onchange="updMod('${mfr.id}','${prod.id}','${md.id}','mk',Number(this.value))"/></td>
        <td><button class="bi d" onclick="delMod('${mfr.id}','${prod.id}','${md.id}')">✕</button></td>
      </tr>`).join('')}
    </tbody>
  </table>
  <div class="ar">
    <input id="mn" placeholder="Nome do módulo"/>
    <input type="number" id="mc" placeholder="Custo R$" step="0.01" min="0" style="max-width:90px"/>
    <input type="number" id="mm" placeholder="Markup" value="1.5" step="0.05" min="1" style="max-width:80px"/>
    <button class="btn bp" onclick="addMod('${mfr.id}','${prod.id}')">+ Módulo</button>
  </div>`:''}`;
}
function renderSvcTab(){
  return `<div class="slbl">Serviços de suporte</div>
  <table class="stbl">
    <thead><tr><th>Tipo</th><th>Descrição</th><th>R$/hora</th><th>Markup padrão</th><th></th></tr></thead>
    <tbody>
      ${S.svcPresets.map(s=>`<tr>
        <td><select style="width:110px" onchange="updSvcP('${s.id}','type',this.value)">
          ${SVC_TYPES.map(t=>`<option${t===s.type?' selected':''}>${t}</option>`).join('')}
        </select></td>
        <td><input value="${esc(s.desc)}" style="width:200px" onchange="updSvcP('${s.id}','desc',this.value)"/></td>
        <td><input type="number" value="${s.rate}" step="1" min="0" style="width:75px" onchange="updSvcP('${s.id}','rate',Number(this.value))"/></td>
        <td><input type="number" value="${s.mk}" step="0.1" min="1" style="width:65px" onchange="updSvcP('${s.id}','mk',Number(this.value))"/></td>
        <td><button class="bi d" onclick="delSvcP('${s.id}')">✕</button></td>
      </tr>`).join('')}
    </tbody>
  </table>
  <div class="ar">
    <select id="st" style="max-width:120px">${SVC_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
    <input id="sd" placeholder="Descrição" style="flex:2"/>
    <input type="number" id="sr" placeholder="R$/hora" step="1" min="0" style="max-width:85px"/>
    <input type="number" id="sm" placeholder="Markup" value="2" step="0.1" min="1" style="max-width:75px"/>
    <button class="btn bp" onclick="addSvcP()">+ Adicionar</button>
  </div>`;
}

// ── Modal Exportação ──────────────────────────────────────────────
function renderExport(R){
  const tQty=S.licenses.reduce((a,l)=>a+l.qty,0);
  const hasSvc=S.services.some(s=>s.hrs>0);
  const D=S.distributors.find(d=>d.id===S.distId);
  const sep='════════════════════════════════════════';
  const sub='──────────────────────────────────────';
  const lines=[sep,'  PROPOSTA COMERCIAL — ROI CIBERSEGURANÇA',sep];
  if(S.project.client)   lines.push('Cliente:           '+S.project.client);
  if(S.project.manager)  lines.push('Gerente de Contas: '+S.project.manager);
  if(S.project.flow)     lines.push('Nº do Fluxo:       '+S.project.flow);
  if(D)                  lines.push('Distribuidor:      '+D.name);
  lines.push('Contrato:          '+S.project.months+' meses','',sub,'  LICENÇAS ADQUIRIDAS',sub);
  S.licenses.forEach((l,i)=>{
    const r=R.lr[i]||{};
    if(!l.qty)return;
    lines.push('Fabricante:  '+l.mfrNm,'Produto:     '+l.prodNm+' — '+l.modNm);
    lines.push('Quantidade:  '+l.qty+' unidades');
    lines.push('Valor unit./mês:         '+fmt(r.su||0));
    lines.push('Total mensal:            '+fmt(r.tot||0));
    lines.push('Total do contrato:       '+fmt((r.tot||0)*S.project.months),'');
  });
  lines.push(sub,'  RESUMO FINANCEIRO',sub);
  lines.push('Valor total mensal:      '+fmt(R.mRev));
  lines.push('Valor total do contrato: '+fmt(R.tRev));
  if(tQty>0) lines.push('Valor por unidade/mês:   '+fmt(R.mRev/tQty));
  if(hasSvc){
    lines.push('',sub,'  SERVIÇOS DE SUPORTE CONTRATADOS',sub);
    S.services.forEach(s=>{if(!s.hrs)return;lines.push('Tipo:      '+s.type,'Descrição: '+s.desc,'Horas:     '+s.hrs+'h','');});
  }
  lines.push(sep);
  const txt=lines.join('\n');
  return `<div class="ov" onclick="if(event.target===this)closeModal()">
    <div class="md sm">
      <div class="mdh"><h2>📄 Exportar Proposta</h2><button class="mdx" onclick="closeModal()">✕</button></div>
      <div class="mdb"><div class="excnt" id="exctnt">${esc(txt)}</div></div>
      <div class="mdf">
        <button class="btn bs" onclick="printExp()">🖨 Imprimir</button>
        <button class="btn bp" id="copybtn" onclick="copyExp()">📋 Copiar</button>
      </div>
    </div>
  </div>`;
}

// ── Ações ─────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Licenças
function licPatch(id,k,v){const l=S.licenses.find(l=>l.id===id);if(l){l[k]=v;render();}}
function licMfr(id,mId){
  const m=S.catalog.find(c=>c.id===mId);const p=m?.products[0];const md=p?.modules[0];
  licPatch(id,'mfrId',mId);licPatch(id,'mfrNm',m?.name||'');
  licPatch(id,'prodId',p?.id||'');licPatch(id,'prodNm',p?.name||'');
  licPatch(id,'modId',md?.id||'');licPatch(id,'modNm',md?.name||'');
  licPatch(id,'cost',md?.cost||0);licPatch(id,'mk',md?.mk||1.5);
}
function licProd(id,pId){
  const l=S.licenses.find(l=>l.id===id);const cat=S.catalog.find(c=>c.id===l?.mfrId);
  const p=cat?.products.find(p=>p.id===pId);const md=p?.modules[0];
  licPatch(id,'prodId',pId);licPatch(id,'prodNm',p?.name||'');
  licPatch(id,'modId',md?.id||'');licPatch(id,'modNm',md?.name||'');
  licPatch(id,'cost',md?.cost||0);licPatch(id,'mk',md?.mk||1.5);
}
function licMod(id,mId){
  const l=S.licenses.find(l=>l.id===id);
  const cat=S.catalog.find(c=>c.id===l?.mfrId);
  const prod=cat?.products.find(p=>p.id===l?.prodId);
  const md=prod?.modules.find(m=>m.id===mId);
  licPatch(id,'modId',mId);licPatch(id,'modNm',md?.name||'');
  licPatch(id,'cost',md?.cost||0);licPatch(id,'mk',md?.mk||1.5);
}
function addLic(){S.licenses.push(newLic());render();}
function rmLic(id){S.licenses=S.licenses.filter(l=>l.id!==id);render();}

// Serviços
function svcPatch(id,k,v){const s=S.services.find(s=>s.id===id);if(s){s[k]=v;render();}}
function svcSel(id,pId){
  const p=S.svcPresets.find(p=>p.id===pId);
  if(p){svcPatch(id,'preId',pId);svcPatch(id,'type',p.type);svcPatch(id,'desc',p.desc);svcPatch(id,'rate',p.rate);svcPatch(id,'mk',p.mk);}
  else svcPatch(id,'preId',pId||'');
}
function addSvc(){S.services.push(newSvc());render();}
function rmSvc(id){S.services=S.services.filter(s=>s.id!==id);render();}

// Impostos
function setTax(k,v){S.taxes[k]=v;render();}
function selDist(id){S.distId=id;const d=S.distributors.find(d=>d.id===id);if(d)S.taxes.iss=d.iss;render();}

// Modal
function openSettings(){S.modal='settings';render();}
function openExport(){S.modal='export';render();}
function closeModal(){S.modal=null;render();}

// Distribuidores
function updDist(id,k,v){const d=S.distributors.find(d=>d.id===id);if(d){d[k]=v;persist();render();}}
function delDist(id){S.distributors=S.distributors.filter(d=>d.id!==id);persist();render();}
function addDist(){
  const n=document.getElementById('dn')?.value.trim();
  const i=Number(document.getElementById('di')?.value||5.65)/100;
  if(!n)return;
  S.distributors.push({id:uid(),name:n,iss:i});persist();render();
}

// Fabricantes
function updMfr(id,v){const m=S.catalog.find(m=>m.id===id);if(m){m.name=v;persist();render();}}
function delMfr(id){S.catalog=S.catalog.filter(m=>m.id!==id);persist();render();}
function addMfr(){
  const n=document.getElementById('fn')?.value.trim();
  if(!n)return;
  S.catalog.push({id:uid(),name:n,products:[]});persist();render();
}

// Produtos
function updProd(mId,pId,v){
  const m=S.catalog.find(m=>m.id===mId);const p=m?.products.find(p=>p.id===pId);
  if(p){p.name=v;persist();render();}
}
function delProd(mId,pId){
  const m=S.catalog.find(m=>m.id===mId);
  if(m){m.products=m.products.filter(p=>p.id!==pId);persist();render();}
}
function addProd(mId){
  const n=document.getElementById('pn')?.value.trim();
  if(!n)return;
  const m=S.catalog.find(m=>m.id===mId);
  if(m){m.products.push({id:uid(),name:n,modules:[]});persist();render();}
}

// Módulos
function updMod(mId,pId,mdId,k,v){
  const m=S.catalog.find(m=>m.id===mId);const p=m?.products.find(p=>p.id===pId);
  const md=p?.modules.find(md=>md.id===mdId);if(md){md[k]=v;persist();render();}
}
function delMod(mId,pId,mdId){
  const m=S.catalog.find(m=>m.id===mId);const p=m?.products.find(p=>p.id===pId);
  if(p){p.modules=p.modules.filter(md=>md.id!==mdId);persist();render();}
}
function addMod(mId,pId){
  const n=document.getElementById('mn')?.value.trim();
  const c=Number(document.getElementById('mc')?.value||0);
  const mk=Number(document.getElementById('mm')?.value||1.5);
  if(!n)return;
  const m=S.catalog.find(m=>m.id===mId);const p=m?.products.find(p=>p.id===pId);
  if(p){p.modules.push({id:uid(),name:n,cost:c,mk});persist();render();}
}

// Presets de serviço
function updSvcP(id,k,v){const s=S.svcPresets.find(s=>s.id===id);if(s){s[k]=v;persist();render();}}
function delSvcP(id){S.svcPresets=S.svcPresets.filter(s=>s.id!==id);persist();render();}
function addSvcP(){
  const t=document.getElementById('st')?.value;
  const d=document.getElementById('sd')?.value.trim();
  const r=Number(document.getElementById('sr')?.value||0);
  const mk=Number(document.getElementById('sm')?.value||2);
  if(!d)return;
  S.svcPresets.push({id:uid(),type:t,desc:d,rate:r,mk});persist();render();
}

// Export
function copyExp(){
  const txt=document.getElementById('exctnt')?.innerText||'';
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('copybtn');
    if(b){b.textContent='✓ Copiado!';b.className='btn bsu';setTimeout(()=>{b.textContent='📋 Copiar';b.className='btn bp';},2000);}
  });
}
function printExp(){
  const txt=document.getElementById('exctnt')?.innerText||'';
  const w=window.open('','_blank');
  w.document.write('<html><head><title>Proposta ROI</title><style>body{font-family:monospace;font-size:13px;padding:30px;white-space:pre;color:#000}</style></head><body>'+esc(txt)+'</body></html>');
  w.document.close();w.print();
}

// ── Start ─────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
