<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculadora de ROI — Cibersegurança</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#222535;--border:#2e3250;--accent:#4f7cff;--accent2:#7c5cfc;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--text:#e2e8f0;--muted:#8892a4;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}
.app{max-width:1400px;margin:0 auto;padding:0 20px 60px}
.app-header{padding:28px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.app-header h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-header p{color:var(--muted);font-size:13px;margin-top:2px}
.header-actions{display:flex;gap:8px}
.app-main{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px}
.card h2{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.contract-months{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.month-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;transition:all .15s;white-space:nowrap}
.month-btn:hover{border-color:var(--accent);color:var(--text)}
.month-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.month-custom{width:65px!important}
.table-wrapper{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(79,124,255,.04)}
.input-sm{width:90px!important}
.input-xs{width:58px!important}
.input-lg{width:140px!important}
.markup-cell{display:flex;align-items:center;gap:6px}
.slider{-webkit-appearance:none;appearance:none;width:90px;height:4px;background:var(--border);border-radius:4px;border:none;padding:0;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer}
.slider:focus{outline:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.qty-cell{display:flex;flex-direction:column;gap:2px}
.vol-hint{font-size:10px;color:var(--warn)}
/* Buttons */
.btn{border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#3d6be0}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
.btn-icon{background:transparent;border:1px solid transparent;border-radius:5px;cursor:pointer;padding:3px 7px;font-size:13px;transition:all .15s}
.btn-icon.danger{color:var(--bad)}.btn-icon.danger:hover{background:rgba(239,68,68,.1);border-color:var(--bad)}
.btn-icon.edit{color:var(--muted)}.btn-icon.edit:hover{color:var(--accent)}
.btn-add{margin-top:10px;background:transparent;border:1px dashed var(--border);color:var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;transition:all .15s;width:100%}
.btn-add:hover{background:rgba(79,124,255,.08);border-color:var(--accent)}
/* Tax panel */
.tax-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tax-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tax-item{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.tax-inputs{display:flex;align-items:center;gap:5px}
.unit{color:var(--muted);font-size:12px}
/* Result */
.result-panel{background:linear-gradient(135deg,#1a1d27,#1e2035);border-color:var(--accent)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-good{border-color:var(--good)}.kpi-good .kpi-value{color:var(--good)}
.kpi-warn{border-color:var(--warn)}.kpi-warn .kpi-value{color:var(--warn)}
.kpi-bad{border-color:var(--bad)}.kpi-bad .kpi-value{color:var(--bad)}
.breakdown summary{cursor:pointer;color:var(--muted);font-size:12px;padding:4px 0;user-select:none}
.breakdown-table{margin-top:10px;border-collapse:collapse;font-size:13px;width:360px}
.breakdown-table td{padding:5px 10px;border-bottom:1px solid var(--border)}
.breakdown-table td:first-child{color:var(--muted)}
.total-row td{font-weight:700;border-top:1px solid var(--border);border-bottom:none}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:780px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:18px 22px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px}
.modal-header h2{font-size:16px;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px}
.modal-close:hover{color:var(--text)}
.modal-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 22px}
.modal-tab{padding:10px 16px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.modal-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.modal-tab:hover{color:var(--text)}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* Settings tables */
.settings-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.settings-table th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--border)}
.settings-table td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.settings-table tr:last-child td{border-bottom:none}
.settings-table input,.settings-table select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px;outline:none}
.settings-table input:focus,.settings-table select:focus{border-color:var(--accent)}
.tree-item{padding:6px 0}
.tree-children{padding-left:20px;border-left:1px solid var(--border);margin-left:10px}
.section-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:var(--surface2);border-radius:6px;margin-top:8px}
.add-row input,.add-row select{flex:1;min-width:100px}
/* Export modal */
.export-modal{max-width:640px}
.export-content{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:monospace;font-size:13px;line-height:1.8;white-space:pre-wrap;max-height:400px;overflow-y:auto;color:var(--text)}
.export-section-title{color:var(--accent);font-weight:700}
.chip{display:inline-block;background:rgba(79,124,255,.15);color:var(--accent);border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useEffect } = React;

// ── Utilitários ────────────────────────────────────────────────────
const fmt  = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtPct = v => (v*100).toFixed(3).replace(/\.?0+$/,'')+'%';
let _id = 100;
const uid  = () => String(++_id);

const VOLUME_TABLE = [{max:99,discount:.2},{max:999,discount:.1},{max:Infinity,discount:.05}];
const CONTRACT_OPTIONS = [12,24,36,48,60];

// ── Dados padrão ──────────────────────────────────────────────────
const DEFAULT_DISTRIBUTORS = [
  {id:'d1', name:'Ingram', iss:0.0565},
  {id:'d2', name:'CLM',    iss:0.0565},
];

const DEFAULT_CATALOG = [
  { id:'m1', name:'IBM', products:[
    { id:'p1', name:'MaaS360', modules:[
      {id:'mod1', name:'Essentials',   cost:17.87, defaultMarkup:1.7},
      {id:'mod2', name:'TeamViewer',   cost:2.96,  defaultMarkup:1.4},
    ]},
  ]},
];

const DEFAULT_SERVICES = [
  {id:'s1', type:'Serviço', description:'Atividades horario comercial',         hourlyRate:75,  defaultMarkup:2},
  {id:'s2', type:'Serviço', description:'Atividades fora do horario comercial', hourlyRate:150, defaultMarkup:1},
];

// ── Persistência ───────────────────────────────────────────────────
function load(key, def){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch{ return def; } }
function save(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch{} }

// ── Cálculo ───────────────────────────────────────────────────────
function calcRow(qty, unitCost, markup, taxRate){
  const saleUnit  = unitCost * markup;
  const total     = qty * saleUnit;
  const taxes     = total * taxRate;
  const cost      = qty * unitCost;
  const profit    = total - cost - taxes;
  return {saleUnit, total, taxes, cost, profit};
}

function calcROI(licenses, services, months, taxes){
  const taxRate = taxes.iss + taxes.adm + taxes.comercial + taxes.suporte;
  const licRows = licenses.map(l => calcRow(l.quantity, l.unitCost, l.markup, taxRate));
  const svcRows = services.map(s => calcRow(s.hours, s.hourlyRate, s.markup, taxRate));
  const monthlyRev = [...licRows,...svcRows].reduce((a,r)=>a+r.total,0);
  const totalRev   = monthlyRev * months;
  const rawCost    = ([...licRows,...svcRows].reduce((a,r)=>a+r.cost,0)) * months;
  const issAmt  = totalRev * taxes.iss;
  const admAmt  = totalRev * taxes.adm;
  const comAmt  = totalRev * taxes.comercial;
  const supAmt  = totalRev * taxes.suporte;
  const totalCost = issAmt+admAmt+comAmt+supAmt+taxes.additionalServices+rawCost;
  const netProfit = totalRev - totalCost;
  const rent      = totalRev>0 ? netProfit/totalRev : 0;
  return {monthlyRev, totalRev, totalCost, rawCost, issAmt, admAmt, comAmt, supAmt, netProfit, rent, licRows, svcRows};
}

function volLabel(qty){
  const t=VOLUME_TABLE.find(t=>qty<=t.max);
  return t?`Ref. desconto: ${(t.discount*100).toFixed(0)}%`:'';
}

// ── Modal base ────────────────────────────────────────────────────
function Modal({title, onClose, footer, children, className=''}){
  useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown',h);
    return ()=>document.removeEventListener('keydown',h);
  },[onClose]);
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className={`modal ${className}`} onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h2>{title}</h2>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-footer">{footer}</div>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// MODAL DE CONFIGURAÇÕES
// ══════════════════════════════════════════════════════════════════
function SettingsModal({catalog,setCatalog,distributors,setDistributors,servicePresets,setServicePresets,onClose}){
  const [tab,setTab]=useState('dist');

  return (
    <Modal title="⚙ Configurações" onClose={onClose}
      footer={<button className="btn btn-primary" onClick={onClose}>Fechar</button>}>
      <div className="modal-tabs" style={{margin:'0 -22px',padding:'0 22px'}}>
        {[['dist','Distribuidores'],['fab','Fabricantes'],['lic','Licenças'],['svc','Serviços']].map(([k,l])=>(
          <div key={k} className={`modal-tab${tab===k?' active':''}`} onClick={()=>setTab(k)}>{l}</div>
        ))}
      </div>
      <div style={{marginTop:16}}>
        {tab==='dist'  && <DistTab distributors={distributors} setDistributors={setDistributors}/>}
        {tab==='fab'   && <FabTab catalog={catalog} setCatalog={setCatalog}/>}
        {tab==='lic'   && <LicTab catalog={catalog} setCatalog={setCatalog}/>}
        {tab==='svc'   && <SvcTab servicePresets={servicePresets} setServicePresets={setServicePresets}/>}
      </div>
    </Modal>
  );
}

// Tab: Distribuidores
function DistTab({distributors,setDistributors}){
  const [form,setForm]=useState({name:'',iss:'5.65'});
  const add=()=>{
    if(!form.name.trim()) return;
    setDistributors(p=>[...p,{id:uid(),name:form.name.trim(),iss:Number(form.iss)/100}]);
    setForm({name:'',iss:'5.65'});
  };
  const upd=(id,field,val)=>setDistributors(p=>p.map(d=>d.id!==id?d:{...d,[field]:field==='iss'?Number(val)/100:val}));
  const del=(id)=>setDistributors(p=>p.filter(d=>d.id!==id));
  return (<>
    <div className="section-label">Distribuidores cadastrados</div>
    <table className="settings-table">
      <thead><tr><th>Nome</th><th>ISS — crédito PIS/Cofins (%)</th><th></th></tr></thead>
      <tbody>
        {distributors.map(d=>(
          <tr key={d.id}>
            <td><input value={d.name} onChange={e=>upd(d.id,'name',e.target.value)} style={{width:140}}/></td>
            <td><input type="number" value={+(d.iss*100).toFixed(4)} step={0.001} min={0}
              onChange={e=>upd(d.id,'iss',e.target.value)} style={{width:100}}/> %</td>
            <td><button className="btn-icon danger" onClick={()=>del(d.id)}>✕</button></td>
          </tr>
        ))}
      </tbody>
    </table>
    <div className="add-row">
      <input placeholder="Nome do distribuidor" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/>
      <input type="number" placeholder="ISS %" value={form.iss} step={0.001} min={0}
        onChange={e=>setForm(p=>({...p,iss:e.target.value}))} style={{maxWidth:100}}/>
      <span style={{fontSize:12,color:'var(--muted)'}}>%</span>
      <button className="btn btn-primary" onClick={add}>+ Adicionar</button>
    </div>
  </>);
}

// Tab: Fabricantes
function FabTab({catalog,setCatalog}){
  const [name,setName]=useState('');
  const add=()=>{
    if(!name.trim()) return;
    setCatalog(p=>[...p,{id:uid(),name:name.trim(),products:[]}]);
    setName('');
  };
  const upd=(id,val)=>setCatalog(p=>p.map(m=>m.id!==id?m:{...m,name:val}));
  const del=(id)=>setCatalog(p=>p.filter(m=>m.id!==id));
  return (<>
    <div className="section-label">Fabricantes</div>
    <table className="settings-table">
      <thead><tr><th>Nome do Fabricante</th><th>Produtos</th><th></th></tr></thead>
      <tbody>
        {catalog.map(m=>(
          <tr key={m.id}>
            <td><input value={m.name} onChange={e=>upd(m.id,e.target.value)} style={{width:160}}/></td>
            <td style={{color:'var(--muted)',fontSize:12}}>{m.products.map(p=>p.name).join(', ')||'—'}</td>
            <td><button className="btn-icon danger" onClick={()=>del(m.id)}>✕</button></td>
          </tr>
        ))}
      </tbody>
    </table>
    <div className="add-row">
      <input placeholder="Nome do fabricante" value={name} onChange={e=>setName(e.target.value)}/>
      <button className="btn btn-primary" onClick={add}>+ Adicionar</button>
    </div>
  </>);
}

// Tab: Licenças (produtos e módulos)
function LicTab({catalog,setCatalog}){
  const [selMfr,setSelMfr]=useState(catalog[0]?.id||'');
  const [selProd,setSelProd]=useState('');
  const [newProd,setNewProd]=useState('');
  const [newMod,setNewMod]=useState({name:'',cost:'',markup:'1.5'});

  const mfr = catalog.find(m=>m.id===selMfr);
  const prod = mfr?.products.find(p=>p.id===selProd);

  const addProd=()=>{
    if(!newProd.trim()||!mfr) return;
    setCatalog(p=>p.map(m=>m.id!==selMfr?m:{...m,products:[...m.products,{id:uid(),name:newProd.trim(),modules:[]}]}));
    setNewProd('');
  };
  const delProd=(pid)=>setCatalog(p=>p.map(m=>m.id!==selMfr?m:{...m,products:m.products.filter(pr=>pr.id!==pid)}));
  const updProd=(pid,val)=>setCatalog(p=>p.map(m=>m.id!==selMfr?m:{...m,products:m.products.map(pr=>pr.id!==pid?pr:{...pr,name:val})}));

  const addMod=()=>{
    if(!newMod.name.trim()||!prod) return;
    const mod={id:uid(),name:newMod.name.trim(),cost:Number(newMod.cost),defaultMarkup:Number(newMod.markup)};
    setCatalog(p=>p.map(m=>m.id!==selMfr?m:{...m,products:m.products.map(pr=>pr.id!==selProd?pr:{...pr,modules:[...pr.modules,mod]})}));
    setNewMod({name:'',cost:'',markup:'1.5'});
  };
  const delMod=(mid)=>setCatalog(p=>p.map(m=>m.id!==selMfr?m:{...m,products:m.products.map(pr=>pr.id!==selProd?pr:{...pr,modules:pr.modules.filter(md=>md.id!==mid)})}));
  const updMod=(mid,field,val)=>setCatalog(p=>p.map(m=>m.id!==selMfr?m:{...m,products:m.products.map(pr=>pr.id!==selProd?pr:{...pr,modules:pr.modules.map(md=>md.id!==mid?md:{...md,[field]:['cost','defaultMarkup'].includes(field)?Number(val):val})})}));

  return (<>
    <div style={{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}}>
      <label style={{flex:1,minWidth:140}}>
        Fabricante
        <select value={selMfr} onChange={e=>{setSelMfr(e.target.value);setSelProd('')}}>
          {catalog.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      </label>
      <label style={{flex:1,minWidth:140}}>
        Produto
        <select value={selProd} onChange={e=>setSelProd(e.target.value)}>
          <option value="">— selecione —</option>
          {mfr?.products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </label>
    </div>

    {mfr && (<>
      <div className="section-label">Produtos de {mfr.name}</div>
      <table className="settings-table">
        <thead><tr><th>Produto</th><th></th></tr></thead>
        <tbody>
          {mfr.products.map(pr=>(
            <tr key={pr.id} style={{cursor:'pointer',background:pr.id===selProd?'rgba(79,124,255,.08)':''}}>
              <td onClick={()=>setSelProd(pr.id)}>
                <input value={pr.name} onChange={e=>updProd(pr.id,e.target.value)} onClick={e=>e.stopPropagation()} style={{width:160}}/>
              </td>
              <td><button className="btn-icon danger" onClick={()=>delProd(pr.id)}>✕</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="add-row">
        <input placeholder="Nome do produto" value={newProd} onChange={e=>setNewProd(e.target.value)}/>
        <button className="btn btn-primary" onClick={addProd}>+ Produto</button>
      </div>
    </>)}

    {prod && (<>
      <div className="section-label" style={{marginTop:18}}>Módulos de {prod.name}</div>
      <table className="settings-table">
        <thead><tr><th>Módulo</th><th>Custo Unit. (R$)</th><th>Markup padrão</th><th></th></tr></thead>
        <tbody>
          {prod.modules.map(md=>(
            <tr key={md.id}>
              <td><input value={md.name} onChange={e=>updMod(md.id,'name',e.target.value)} style={{width:130}}/></td>
              <td><input type="number" value={md.cost} step={0.01} min={0} onChange={e=>updMod(md.id,'cost',e.target.value)} style={{width:80}}/></td>

function ExportModal({licenses,services,result,project,distributor,onClose}){
  const {monthlyRev,totalRev,licRows,svcRows}=result;
  const totalQty = licenses.reduce((a,l)=>a+l.quantity,0);
  const hasSvc   = services.some(s=>s.hours>0);

  const lines=[];
  lines.push('════════════════════════════════════════');
  lines.push('  PROPOSTA COMERCIAL — ROI CIBERSEGURANÇA');
  lines.push('════════════════════════════════════════');
  if(project.client) lines.push(`Cliente:          ${project.client}`);
  if(project.accountManager) lines.push(`Gerente de Contas: ${project.accountManager}`);
  if(project.flowNumber) lines.push(`Nº do Fluxo:      ${project.flowNumber}`);
  if(distributor) lines.push(`Distribuidor:      ${distributor.name}`);
  lines.push(`Contrato:         ${project.contractMonths} meses`);
  lines.push('');
  lines.push('──────────────────────────────────────');
  lines.push('  LICENÇAS ADQUIRIDAS');
  lines.push('──────────────────────────────────────');
  licenses.forEach((l,i)=>{
    const row=licRows[i]||{};
    if(l.quantity===0) return;
    lines.push(`Fabricante:  ${l.manufacturer}`);
    lines.push(`Produto:     ${l.product} — ${l.module}`);
    lines.push(`Quantidade:  ${l.quantity} unidades`);
    lines.push(`Valor unit./mês (venda): ${fmt(row.saleUnit||0)}`);
    lines.push(`Total mensal: ${fmt(row.total||0)}`);
    lines.push(`Total contrato (${project.contractMonths}m): ${fmt((row.total||0)*project.contractMonths)}`);
    lines.push('');
  });

  lines.push('──────────────────────────────────────');
  lines.push('  RESUMO FINANCEIRO');
  lines.push('──────────────────────────────────────');
  lines.push(`Valor total mensal:     ${fmt(monthlyRev)}`);
  lines.push(`Valor total do contrato: ${fmt(totalRev)}`);
  if(totalQty>0){
    lines.push(`Valor por unidade/mês:  ${fmt(monthlyRev/totalQty)}`);
  }

  if(hasSvc){
    lines.push('');
    lines.push('──────────────────────────────────────');
    lines.push('  SERVIÇOS DE SUPORTE CONTRATADOS');
    lines.push('──────────────────────────────────────');
    services.forEach(s=>{
      if(s.hours===0) return;
      lines.push(`Tipo:        ${s.type}`);
      lines.push(`Descrição:   ${s.description}`);
      lines.push(`Horas:       ${s.hours}h`);
      lines.push('');
    });
  }
  lines.push('════════════════════════════════════════');

  const text=lines.join('\n');
  const [copied,setCopied]=useState(false);
  const copy=()=>{
    navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)});
  };
  const print=()=>{
    const w=window.open('','_blank');
    w.document.write(`<html><head><title>Proposta ROI</title><style>body{font-family:monospace;font-size:13px;padding:30px;white-space:pre}</style></head><body>${text.replace(/</g,'&lt;')}</body></html>`);
    w.document.close();w.print();
  };

  return (
    <Modal title="📄 Exportar Proposta" onClose={onClose} className="export-modal"
      footer={<>
        <button className="btn btn-secondary" onClick={print}>🖨 Imprimir</button>
        <button className={`btn ${copied?'btn-success':'btn-primary'}`} onClick={copy}>{copied?'✓ Copiado!':'📋 Copiar'}</button>
      </>}>
      <div className="export-content">{text}</div>
    </Modal>
  );
}

function App(){
  const [catalog,       setCatalog]        = useState(()=>load('roi_catalog',DEFAULT_CATALOG));
  const [distributors,  setDistributors]   = useState(()=>load('roi_dist',DEFAULT_DISTRIBUTORS));
  const [servicePresets,setServicePresets] = useState(()=>load('roi_svc',DEFAULT_SERVICES));

  useEffect(()=>save('roi_catalog',catalog),[catalog]);
  useEffect(()=>save('roi_dist',distributors),[distributors]);
  useEffect(()=>save('roi_svc',servicePresets),[servicePresets]);

  const [project,setProject]=useState({client:'',accountManager:'',flowNumber:'',contractMonths:12});
  const [taxes,setTaxes]=useState({iss:0.0565,adm:0.05,comercial:0.045,suporte:0,additionalServices:0});
  const [selectedDistId,setSelectedDistId]=useState(distributors[0]?.id||'');

  const [showSettings,setShowSettings]=useState(false);
  const [showExport,  setShowExport]  =useState(false);

  const newLicense=useCallback(()=>{
    const m=catalog[0]; const p=m?.products[0]; const mod=p?.modules[0];
    return {id:uid(),mfrId:m?.id||'',manufacturer:m?.name||'',prodId:p?.id||'',product:p?.name||'',modId:mod?.id||'',module:mod?.name||'',quantity:190,unitCost:mod?.cost||0,markup:mod?.defaultMarkup||1.5};
  },[catalog]);

  const newService=useCallback(()=>{
    const s=servicePresets[0];
    return {id:uid(),presetId:s?.id||'',type:s?.type||'Serviço',description:s?.description||'',hours:0,hourlyRate:s?.hourlyRate||75,markup:s?.defaultMarkup||2};
  },[servicePresets]);

  const [licenses,setLicenses]=useState(()=>[newLicense()]);
  const [services,setServices]=useState(()=>[newService()]);

  const updLicense=useCallback((id,patch)=>setLicenses(p=>p.map(l=>l.id!==id?l:{...l,...patch})),[]);
  const updService=useCallback((id,patch)=>setServices(p=>p.map(s=>s.id!==id?s:{...s,...patch})),[]);

  const result=useMemo(()=>calcROI(licenses,services,project.contractMonths,taxes),[licenses,services,project.contractMonths,taxes]);
  const selectedDist=distributors.find(d=>d.id===selectedDistId)||null;

  return (
    <div className="app">
      <div className="app-header">
        <div>
          <h1>Calculadora de ROI</h1>
          <p>Precificação para Faturamento — Cibersegurança</p>
        </div>
        <div className="header-actions">
          <button className="btn btn-secondary" onClick={()=>setShowSettings(true)}>⚙ Configurações</button>
          <button className="btn btn-primary"   onClick={()=>setShowExport(true)}>📄 Exportar</button>
        </div>
      </div>

      <main className="app-main">
        <ProjectHeader project={project} onChange={setProject}/>
        <LicenseTable items={licenses} rows={result.licRows} catalog={catalog}
          onUpdate={updLicense}
          onAdd={()=>setLicenses(p=>[...p,newLicense()])}
          onRemove={id=>setLicenses(p=>p.filter(l=>l.id!==id))}/>
        <ServiceTable items={services} rows={result.svcRows} servicePresets={servicePresets}
          onUpdate={updService}
          onAdd={()=>setServices(p=>[...p,newService()])}
          onRemove={id=>setServices(p=>p.filter(s=>s.id!==id))}/>
        <TaxPanel taxes={taxes} setTaxes={setTaxes}
          distributors={distributors} selectedDistId={selectedDistId} setSelectedDistId={setSelectedDistId}/>
        <ResultPanel result={result} months={project.contractMonths}/>
      </main>

      {showSettings && (
        <SettingsModal
          catalog={catalog} setCatalog={setCatalog}
          distributors={distributors} setDistributors={setDistributors}
          servicePresets={servicePresets} setServicePresets={setServicePresets}
          onClose={()=>setShowSettings(false)}/>
      )}
      {showExport && (
        <ExportModal
          licenses={licenses} services={services} result={result}
          project={project} distributor={selectedDist}
          onClose={()=>setShowExport(false)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
